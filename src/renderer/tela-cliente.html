<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Tela do Cliente</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #0f0f0f;
    color: #f0ede8;
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
    user-select: none;
    cursor: none;
  }
  .tela {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 5vh 6vw;
    text-align: center;
  }

  /* Estado ocioso — logo da loja (sem produto de destaque configurado) */
  #ocioso { display: flex; flex-direction: column; align-items: center; gap: 24px; }
  #ocioso img { max-width: 42vw; max-height: 32vh; object-fit: contain; opacity: .95; }
  #ocioso .tagline { font-size: 1.4vw; color: #9a9590; letter-spacing: .5px; }
  #ocioso.escondido { display: none; }

  /* Estado produto — usado tanto pra seleção do vendedor quanto pro
     carrossel de destaque (tag) enquanto ociosa */
  #produto { display: none; flex-direction: column; align-items: center; gap: 2.2vh; width: 100%; opacity: 1; }
  #produto.ativo { display: flex; }
  #produto.fade { animation: fadeIn .6s ease; }
  @keyframes fadeIn {
    from { opacity: 0; transform: scale(.97); }
    to   { opacity: 1; transform: scale(1); }
  }

  #produto-tag {
    display: none;
    font-size: 1.1vw; font-weight: 700; letter-spacing: 1.5px;
    padding: .8vh 1.8vw; border-radius: 999px;
    background: linear-gradient(135deg, #1a3a8f 0%, #1565c0 55%, #00b4d8 100%);
    color: #fff;
  }

  #produto-img-wrap {
    width: 44vw; height: 44vw; max-height: 48vh;
    display: flex; align-items: center; justify-content: center;
    background: #1e1e1e; border-radius: 24px;
    overflow: hidden;
  }
  #produto-img-wrap img { width: 100%; height: 100%; object-fit: contain; }
  #produto-img-wrap .sem-foto { font-size: 12vw; }

  #produto-nome { font-size: 3.2vw; font-weight: 700; line-height: 1.25; max-width: 90vw; }
  #produto-sku { font-size: 1.2vw; color: #5a5650; margin-top: -1.5vh; }
  #produto-preco { font-size: 5.5vw; font-weight: 800; color: #2e8eff; margin-top: 1vh; }
</style>
</head>
<body>
  <div class="tela">
    <div id="ocioso">
      <img src="assets/logo.png" alt="Logo">
      <div class="tagline">Bem-vindo!</div>
    </div>
    <div id="produto">
      <div id="produto-tag"></div>
      <div id="produto-img-wrap"><span class="sem-foto">📦</span></div>
      <div id="produto-nome"></div>
      <div id="produto-sku"></div>
      <div id="produto-preco"></div>
    </div>
  </div>

<script>
  let carrosselTimer = null;
  let carrosselProdutos = [];
  let carrosselIndex = 0;

  function fmtMoney(v) {
    return 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function pararCarrossel() {
    if (carrosselTimer) { clearInterval(carrosselTimer); carrosselTimer = null; }
    carrosselProdutos = [];
  }

  // Preenche o bloco de produto (imagem/nome/preço) e, quando houver, o
  // selo da tag — reaproveitado tanto pela seleção do vendedor (sem tag)
  // quanto pelo carrossel de destaque ocioso (com tag).
  function exibirProdutoNaTela(p, tag) {
    document.getElementById('ocioso').classList.add('escondido');
    const wrap = document.getElementById('produto-img-wrap');
    if (p.foto_url) {
      wrap.innerHTML = `<img src="${p.foto_url}" onerror="this.parentElement.innerHTML='<span class=\\'sem-foto\\'>📦</span>'">`;
    } else {
      wrap.innerHTML = '<span class="sem-foto">📦</span>';
    }
    document.getElementById('produto-nome').textContent = p.nome || '';
    document.getElementById('produto-sku').textContent = p.sku ? `Cód: ${p.sku}` : '';
    document.getElementById('produto-preco').textContent = fmtMoney(p.preco_venda);

    const tagEl = document.getElementById('produto-tag');
    if (tag) { tagEl.textContent = tag; tagEl.style.display = 'inline-block'; }
    else { tagEl.style.display = 'none'; }

    const painel = document.getElementById('produto');
    painel.classList.remove('fade');
    void painel.offsetWidth; // força reinício da animação a cada troca
    painel.classList.add('ativo', 'fade');
  }

  // Vendedor selecionou um produto de verdade — sempre tem prioridade sobre
  // o carrossel, que para imediatamente até o próximo estado ocioso.
  function mostrarProduto(p) {
    pararCarrossel();
    exibirProdutoNaTela(p, null);
  }

  function exibirItemCarrossel(tag) {
    const p = carrosselProdutos[carrosselIndex];
    if (p) exibirProdutoNaTela(p, tag);
  }

  // Sem produto em foco: se houver produtos com a tag de destaque
  // configurada, mostra um carrossel suave entre eles; senão, a logo.
  function mostrarOcioso(data) {
    pararCarrossel();
    const produtos = (data && data.produtos) || [];
    if (!produtos.length) {
      document.getElementById('ocioso').classList.remove('escondido');
      document.getElementById('produto').classList.remove('ativo');
      document.getElementById('produto-tag').style.display = 'none';
      return;
    }
    carrosselProdutos = produtos;
    carrosselIndex = 0;
    const tag = data.tag || '';
    const intervaloMs = Math.max(3, Number(data.intervaloSeg) || 8) * 1000;
    exibirItemCarrossel(tag);
    carrosselTimer = setInterval(() => {
      carrosselIndex = (carrosselIndex + 1) % carrosselProdutos.length;
      exibirItemCarrossel(tag);
    }, intervaloMs);
  }

  window.telaCliente.onProduto(mostrarProduto);
  window.telaCliente.onIdle(mostrarOcioso);
</script>
</body>
</html>
